// One jar for every supported Minecraft version.
// It holds no code. It nests :core (1.20.x - 1.21.x), :core-26 (26.1 - 26.2) and :core-26-sdl (26.3+)
// with jar-in-jar. All three use the mod id "early-loading-screen", and Fabric Loader keeps
// the one whose "minecraft" and "java" ranges match the running game.
plugins {
    id 'java'
}

base {
    archivesName = project.archives_base_name + "-all"
}

evaluationDependsOn(":core")
evaluationDependsOn(":core-26")
evaluationDependsOn(":core-26-sdl")

def nested = [
        project(":core").tasks.named("remapJar"),
        project(":core-26").tasks.named("jar"),
        project(":core-26-sdl").tasks.named("jar")
]

// Nested jars must keep distinct file names. Prefix each one with its project name.
def nestedDir = layout.buildDirectory.dir("nested")
def collectNested = tasks.register("collectNested", Copy) {
    nested.each { dependsOn it }
    into nestedDir
    nested.each { t ->
        from(t.flatMap { it.archiveFile }) {
            rename { "${t.get().project.name}-${project.version}.jar" }
        }
    }
}

tasks.named("jar") {
    dependsOn collectNested
    from(nestedDir) { into "META-INF/jars" }
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
