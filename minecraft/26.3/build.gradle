apply plugin: "net.fabricmc.fabric-loom"


base {
    archivesName = project.archives_base_name + "-26.3"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        url = "https://maven.minecraftforge.net"
    }
}

sourceSets {
    main {
        java {
            srcDirs += ["src/main/neoforge"]
        }
    }
}

ExternalModuleDependency dependency0;
ExternalModuleDependency dependency1;
dependencies {
    dependency0 = implementation 'net.bytebuddy:byte-buddy-agent:1.14.0'
    dependency1 = implementation "net.minecraftforge:unsafe:0.9.2"
}

loom {
    mixin {
        useLegacyMixinAp = false
    }
    accessWidenerPath = file("src/main/resources/early-loading-screen-26-3.accesswidener")
    mods {
        m {
            sourceSet sourceSets.main
            dependency(dependency0, dependency1)
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:${project.loader_version_unobf}"
    implementation(project(":core:26.3"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}


java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("../../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
