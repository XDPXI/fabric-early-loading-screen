// Same sources as :core, for unobfuscated versions (26.1+)
apply plugin: "net.fabricmc.fabric-loom"

base {
    archivesName = project.archives_base_name + "-26"
}

repositories {
    maven {
        url = "https://maven.minecraftforge.net"
    }
}

def coreDir = file("../core/src/main")

sourceSets {
    main {
        java {
            srcDirs += [
                    "$coreDir/core", "$coreDir/neoforge", "$coreDir/loader", "$coreDir/earlydisplay"
            ]
            // Older versions only
            exclude "**/mixin/compat/**"
            // Provided by each 26.x module
            exclude "**/mixin/MinecraftClientMixin.java"
            exclude "**/neoforge/client/loading/NeoForgeLoadingOverlay.java"
        }
    }
    testmod {
        java.srcDirs = ["../core/src/testmod/java"]
        resources.srcDirs = ["../core/src/testmod/resources"]
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

dependencies {
    implementation include('net.bytebuddy:byte-buddy-agent:1.14.0')
    implementation include("net.minecraftforge:unsafe:0.9.2")
}

loom {
    runs {
        testmodClient {
            client()
            name = "Testmod Client"
            source sourceSets.testmod
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version_unobf}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version_unobf}"

    testmodImplementation(sourceSets.main.output)
    include(project(path: ":minecraft:26.1.2"))
    include(project(path: ":minecraft:26.2"))
}

testmodClasses.dependsOn classes

processResources {
    inputs.property "version", project.version

    from("$coreDir/resources") {
        // Provided by this project
        exclude "fabric.mod.json"
        exclude "early-loading-screen-1.20.1.mixins.json"
        exclude "early-loading-screen.mixins.json"
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
